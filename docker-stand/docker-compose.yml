services:
  # Одноразово создаёт на хосте ./logs/nginx (bind mount) до старта nginx
  logs-init:
    image: alpine:3.19
    volumes:
      - ./logs/nginx:/target
    command: sh -c "mkdir -p /target && chmod 0755 /target"
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      dvwa:
        condition: service_started
      logs-init:
        condition: service_completed_successfully
    networks:
      - ips-net

  dvwa:
    image: vulnerables/web-dvwa
    environment:
      - RECAPTCHA_PRIV_KEY=
      - RECAPTCHA_PUB_KEY=
      - SECURITY_LEVEL=low
      - PHPIDS_ENABLED=0
    networks:
      - ips-net

networks:
  ips-net:
    driver: bridge
