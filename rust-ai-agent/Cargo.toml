[package]
name = "rust-ai-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4"
dashmap = "6"
encoding_rs = "0.8.35"
indicatif = "0.18.4"
llama-cpp-2 = "0.1.138"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.30"
tokio = { version = "1.49.0", features = ["full"] }
