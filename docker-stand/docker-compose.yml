services:
  # Одноразово создаёт на хосте ./logs/nginx (bind mount) до старта nginx
  logs-init:
    image: alpine:3.19
    volumes:
      - ./logs/nginx:/target
    command: sh -c "mkdir -p /target && chmod 0755 /target"
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      dvwa:
        condition: service_started
      logs-init:
        condition: service_completed_successfully
    networks:
      - ips-net

  dvwa:
    image: vulnerables/web-dvwa
    environment:
      - RECAPTCHA_PRIV_KEY=
      - RECAPTCHA_PUB_KEY=
      - SECURITY_LEVEL=low
      - PHPIDS_ENABLED=0
    networks:
      - ips-net

  # Одноразовый прогон k6 (профиль load). В логах nginx клиент — IP контейнера k6.
  k6-mixed:
    image: grafana/k6:latest
    profiles:
      - load
    networks:
      - ips-net
    volumes:
      - ./load-tests:/scripts:ro
    working_dir: /scripts
    environment:
      BASE_URL: http://nginx
      BAD_RATIO: "0.15"
      K6_VUS: "5"
      K6_DURATION: "2m"
      DVWA_USER: admin
      DVWA_PASSWORD: password
    command: ["run", "k6-mixed.js"]
    depends_on:
      nginx:
        condition: service_started

  k6-benign:
    image: grafana/k6:latest
    profiles:
      - load
    networks:
      - ips-net
    volumes:
      - ./load-tests:/scripts:ro
    working_dir: /scripts
    environment:
      BASE_URL: http://nginx
      K6_VUS: "5"
      K6_DURATION: "2m"
      DVWA_USER: admin
      DVWA_PASSWORD: password
    command: ["run", "k6-benign.js"]
    depends_on:
      nginx:
        condition: service_started

networks:
  ips-net:
    driver: bridge
